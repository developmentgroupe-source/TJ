<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
        :root { --bg: #0d0f14; --bg-card: #13161e; --border: #2a2f3d; --blue: #4a9eff; }
        body { background: var(--bg); color: #e8eaf0; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden; }
        .sidebar { width: 220px; border-right: 1px solid var(--border); background: var(--bg-card); }
        .nav-item { cursor: pointer; transition: 0.2s; color: #8b90a0; }
        .nav-item:hover, .nav-item.active { background: #4a9eff12; color: var(--blue); border-left: 3px solid var(--blue); }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        .trade-row { cursor: pointer; border-bottom: 1px solid var(--border); transition: 0.1s; }
        .trade-row:hover { background: #1a1e28; }
        /* Modal Gráfico Fullscreen */
        #chart-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; }
    </style>
</head>
<body class="flex h-screen">

    <aside class="sidebar flex flex-col">
        <div class="p-6 font-mono text-sm border-bottom border-slate-800 flex items-center gap-2">
            <div class="w-2 h-2 bg-green-500 rounded-full"></div> JOURNAL PRO
        </div>
        <nav class="flex-1 mt-4">
            <div onclick="showPage('trades')" class="nav-item active p-4 flex items-center gap-3"><i class="fas fa-list"></i> Mis trades</div>
            <div onclick="showPage('analytics')" class="nav-item p-4 flex items-center gap-3"><i class="fas fa-chart-pie"></i> Analítica</div>
            <div onclick="showPage('import')" class="nav-item p-4 flex items-center gap-3"><i class="fas fa-file-import"></i> Importar</div>
        </nav>
        <div class="p-6 border-t border-slate-800">
            <div class="text-[10px] text-slate-500 uppercase">P&L Total</div>
            <div id="side-pnl" class="text-xl font-mono">$0.00</div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-14 border-b border-slate-800 flex items-center justify-between px-8 bg-[#0d0f14]">
            <h2 id="page-title" class="text-sm font-semibold uppercase tracking-wider">Mis trades</h2>
            <button onclick="openForm()" class="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded text-xs font-bold text-white transition">+ NUEVO TRADE</button>
        </header>

        <div class="p-8 overflow-y-auto">
            <div id="view-trades" class="page-content">
                <div class="grid grid-cols-4 gap-4 mb-8">
                    <div class="stat-card">
                        <div class="text-[10px] text-slate-500 uppercase mb-1">Win Rate</div>
                        <div id="stat-wr" class="text-2xl font-mono text-blue-400">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="text-[10px] text-slate-500 uppercase mb-1">Profit Factor</div>
                        <div class="text-2xl font-mono text-white">1.42</div>
                    </div>
                    <div class="stat-card">
                        <div class="text-[10px] text-slate-500 uppercase mb-1">Trades Totales</div>
                        <div id="stat-count" class="text-2xl font-mono text-white">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="text-[10px] text-slate-500 uppercase mb-1">Net P&L</div>
                        <div id="stat-pnl" class="text-2xl font-mono text-green-400">$0.00</div>
                    </div>
                </div>

                <div class="bg-[#13161e] border border-slate-800 rounded-lg overflow-hidden">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-[#1a1e28] text-slate-500 uppercase font-mono">
                            <tr>
                                <th class="p-4">Ticker</th>
                                <th class="p-4">Entrada</th>
                                <th class="p-4">Salida</th>
                                <th class="p-4">P&L $</th>
                                <th class="p-4">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="trades-list"></tbody>
                    </table>
                </div>
            </div>

            <div id="view-analytics" class="page-content hidden">
                <h3 class="text-xl mb-4">Desempeño Detallado</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div class="stat-card h-64 flex items-center justify-center text-slate-500 italic">Gráfico de Equity (Próximamente)</div>
                    <div class="stat-card h-64 flex items-center justify-center text-slate-500 italic">Distribución por Ticker</div>
                </div>
            </div>
        </div>
    </main>

    <div id="chart-modal">
        <div class="h-12 bg-[#13161e] border-b border-slate-800 flex items-center justify-between px-6">
            <span id="chart-title" class="font-mono text-blue-400"></span>
            <button onclick="closeChart()" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <div id="tv-container" class="flex-1"></div>
    </div>

    <div id="form-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#13161e] border border-slate-800 w-full max-w-md rounded-xl p-6">
            <h3 class="text-lg mb-4 text-blue-400">Registrar Operación</h3>
            <form id="trade-form" class="space-y-4 text-sm">
                <div><label class="block text-slate-500 mb-1 uppercase text-[10px]">Ticker</label><input id="f-ticker" type="text" class="w-full bg-[#1a1e28] border border-slate-700 p-2 rounded outline-none uppercase" required></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-slate-500 mb-1 uppercase text-[10px]">Entrada</label><input id="f-entry" type="number" step="0.01" class="w-full bg-[#1a1e28] border border-slate-700 p-2 rounded outline-none" required></div>
                    <div><label class="block text-slate-500 mb-1 uppercase text-[10px]">Salida</label><input id="f-exit" type="number" step="0.01" class="w-full bg-[#1a1e28] border border-slate-700 p-2 rounded outline-none" required></div>
                </div>
                <button type="submit" class="w-full bg-blue-600 p-3 rounded font-bold hover:bg-blue-500 transition mt-4">GUARDAR EN FIREBASE</button>
                <button type="button" onclick="closeForm()" class="w-full text-slate-500 text-xs mt-2">CANCELAR</button>
            </form>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
            authDomain: "trading-journal-ac545.firebaseapp.com",
            projectId: "trading-journal-ac545",
            storageBucket: "trading-journal-ac545.firebasestorage.app",
            messagingSenderId: "113557647477",
            appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // NAVEGACIÓN
        window.showPage = (id) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('page-title').innerText = id === 'trades' ? 'Mis trades' : id;
        };

        // FORMULARIO
        window.openForm = () => document.getElementById('form-modal').classList.remove('hidden');
        window.closeForm = () => document.getElementById('form-modal').classList.add('hidden');

        // GRÁFICO FULLSCREEN
        window.openChart = (symbol) => {
            document.getElementById('chart-modal').style.display = 'flex';
            document.getElementById('chart-title').innerText = `ANÁLISIS TÉCNICO: ${symbol}`;
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol.includes(':') ? symbol : "NASDAQ:" + symbol,
                "interval": "D",
                "timezone": "America/New_York",
                "theme": "dark",
                "style": "1",
                "locale": "es",
                "container_id": "tv-container",
                "hide_side_toolbar": false
            });
        };
        window.closeChart = () => document.getElementById('chart-modal').style.display = 'none';

        // GUARDAR
        document.getElementById('trade-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "trades"), {
                symbol: document.getElementById('f-ticker').value.toUpperCase(),
                entry: parseFloat(document.getElementById('f-entry').value),
                exit: parseFloat(document.getElementById('f-exit').value),
                timestamp: new Date()
            });
            closeForm();
            document.getElementById('trade-form').reset();
        });

        // CARGAR DATOS
        onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snap) => {
            const list = document.getElementById('trades-list');
            list.innerHTML = '';
            let total = 0, wins = 0, count = 0;

            snap.forEach(doc => {
                const t = doc.data();
                const pnl = t.exit - t.entry;
                total += pnl; count++;
