<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trading Journal Ultra-Simple</title>
    <style>
        body { background: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 350px; background: #151921; border-right: 1px solid #242933; padding: 20px; box-sizing: border-box; }
        .main { flex: 1; position: relative; background: #000; }
        input, select { background: #1e222d; border: 1px solid #242933; color: white; padding: 12px; margin-bottom: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { background: #2962ff; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .trade-item { padding: 15px; background: #1c212b; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #2962ff; cursor: pointer; }
        .trade-item:hover { background: #252b37; }
        #chart-container { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Mi Diario</h2>
    <input type="text" id="sym" placeholder="Símbolo (Ej: BTCUSDT o AAPL)">
    <input type="date" id="date">
    <select id="side"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
    <button class="btn" onclick="saveTrade()">Guardar y Ver</button>
    <hr style="border: 0; border-top: 1px solid #242933; margin: 20px 0;">
    <div id="list"></div>
</div>

<div class="main">
    <div id="chart-container">
        <div style="padding: 50px; text-align: center; color: #5d606b;">
            Escribe un símbolo y dale a "Guardar" para cargar el gráfico.
        </div>
    </div>
</div>

<script>
    let trades = JSON.parse(localStorage.getItem('simple_journal') || '[]');

    function loadChart(symbol) {
        const container = document.getElementById('chart-container');
        container.innerHTML = ''; // Limpiar
        
        // Creamos el widget oficial de TradingView
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/tv.js";
        script.onload = () => {
            new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "es",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "chart-container"
            });
        };
        document.head.appendChild(script);
    }

    function saveTrade() {
        const symbol = document.getElementById('sym').value.toUpperCase().trim() || "BTCUSDT";
        const date = document.getElementById('date').value;
        const side = document.getElementById('side').value;

        const trade = { symbol, date, side };
        trades.unshift(trade);
        localStorage.setItem('simple_journal', JSON.stringify(trades));
        
        renderList();
        loadChart(symbol);
    }

    function renderList() {
        const container = document.getElementById('list');
        container.innerHTML = '';
        trades.forEach(t => {
            const d = document.createElement('div');
            d.className = 'trade-item';
            d.innerHTML = `<strong>${t.symbol}</strong> - ${t.side}<br><small>${t.date}</small>`;
            d.onclick = () => loadChart(t.symbol);
            container.appendChild(d);
        });
    }

    renderList();
</script>
</body>
</html>
