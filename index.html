<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0b0e14; --card-bg: #151921; --accent: #3b82f6; --text-dim: #94a3b8; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; }
        .sidebar { width: 240px; border-right: 1px solid #1e293b; height: 100vh; position: fixed; }
        .main-content { margin-left: 240px; padding: 24px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: var(--text-dim); transition: 0.2s; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: white; }
        .trade-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .trade-table tr { background: var(--card-bg); }
        .trade-table td, .trade-table th { padding: 12px 16px; font-size: 13px; }
        .trade-table th { color: var(--text-dim); text-align: left; text-transform: uppercase; font-size: 11px; }
        .btn-primary { background: #3b82f6; color: white; padding: 8px 16px; border-radius: 6px; font-weight: 600; }
        .status-win { color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 4px; }
        .status-loss { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar p-4 flex flex-col justify-between">
        <div>
            <div class="text-blue-500 font-bold text-xl mb-8 flex items-center gap-2">
                <i class="fas fa-chart-line"></i> JOURNAL
            </div>
            <nav class="space-y-2">
                <div class="nav-item active"><i class="fas fa-list"></i> Mis trades</div>
                <div class="nav-item"><i class="fas fa-plus-circle"></i> Nuevo trade</div>
                <div class="nav-item"><i class="fas fa-chart-pie"></i> Analítica</div>
                <div class="nav-item"><i class="fas fa-file-import"></i> Importar trades</div>
                <div class="nav-item"><i class="fas fa-tv"></i> Exportar a TV</div>
            </nav>
        </div>
        <div class="p-4 bg-slate-900 rounded-lg">
            <div class="text-xs text-slate-400">P&L TOTAL</div>
            <div class="text-lg font-bold text-green-400" id="total-pl-sidebar">$0.00</div>
        </div>
    </div>

    <div class="main-content">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold">Mis trades</h1>
                <p class="text-sm text-slate-400" id="current-date"></p>
            </div>
            <div class="flex gap-3">
                <button class="bg-slate-800 px-4 py-2 rounded-lg text-sm"><i class="fas fa-sync"></i> Sync</button>
                <button class="btn-primary text-sm">+ Nuevo trade</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8 text-center">
            <div class="stat-card">
                <div class="text-[10px] text-slate-400">P&L TOTAL</div>
                <div class="text-xl font-bold text-green-400" id="stats-pl">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="text-[10px] text-slate-400">WIN RATE</div>
                <div class="text-xl font-bold text-blue-400" id="stats-wr">0%</div>
            </div>
            <div class="stat-card">
                <div class="text-[10px] text-slate-400">PROFIT FACTOR</div>
                <div class="text-xl font-bold">0.0</div>
            </div>
            <div class="stat-card">
                <div class="text-[10px] text-slate-400">AVG WIN</div>
                <div class="text-xl font-bold text-green-400">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="text-[10px] text-slate-400">OPEN</div>
                <div class="text-xl font-bold">0</div>
            </div>
            <div class="stat-card">
                <div class="text-[10px] text-slate-400">TOTAL TRADES</div>
                <div class="text-xl font-bold" id="stats-total">0</div>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="trade-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Ticker</th>
                        <th>Dir</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>P&L $</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="trades-tbody">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
            authDomain: "trading-journal-ac545.firebaseapp.com",
            projectId: "trading-journal-ac545",
            storageBucket: "trading-journal-ac545.firebasestorage.app",
            messagingSenderId: "113557647477",
            appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

        onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snapshot) => {
            const tbody = document.getElementById('trades-tbody');
            tbody.innerHTML = '';
            
            let totalPL = 0;
            let wins = 0;
            let count = 0;

            snapshot.forEach((doc) => {
                const t = doc.data();
                const pnl = parseFloat(t.exit) - parseFloat(t.entry);
                totalPL += pnl;
                count++;
                if(pnl > 0) wins++;

                const row = `
                    <tr class="hover:bg-slate-800 transition">
                        <td class="rounded-l-lg text-slate-400">${t.timestamp.toDate().toLocaleDateString()}</td>
                        <td class="font-bold">${t.symbol}</td>
                        <td><span class="text-blue-400 text-xs">Long</span></td>
                        <td>$${t.entry}</td>
                        <td>$${t.exit}</td>
                        <td class="${pnl >= 0 ? 'text-green-400' : 'text-red-400'} font-mono font-bold">$${pnl.toFixed(2)}</td>
                        <td><span class="${pnl >= 0 ? 'status-win' : 'status-loss'} text-[10px] font-bold uppercase">${pnl >= 0 ? 'Win' : 'Loss'}</span></td>
                        <td class="rounded-r-lg text-right"><button class="text-slate-500 hover:text-white"><i class="fas fa-edit"></i></button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Actualizar Stats
            document.getElementById('stats-pl').innerText = `$${totalPL.toFixed(2)}`;
            document.getElementById('total-pl-sidebar').innerText = `$${totalPL.toFixed(2)}`;
            document.getElementById('stats-total').innerText = count;
            document.getElementById('stats-wr').innerText = count > 0 ? `${((wins/count)*100).toFixed(0)}%` : '0%';
        });
    </script>
</body>
</html>
