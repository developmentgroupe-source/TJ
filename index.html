<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Pro | Stocks</title>
    <style>
        :root { --bg: #0b0e14; --side: #151921; --accent: #2962ff; --text: #d1d4dc; --border: #242933; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background: var(--side); border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; box-sizing: border-box; }
        .main { flex: 1; display: flex; flex-direction: column; background: #000; }
        h2 { color: var(--accent); margin: 0 0 20px 0; font-size: 22px; letter-spacing: -0.5px; }
        input, select, textarea { background: #1e222d; border: 1px solid var(--border); color: white; padding: 12px; margin-bottom: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn-save { background: var(--accent); color: white; border: none; padding: 15px; cursor: pointer; border-radius: 6px; font-weight: 600; width: 100%; transition: opacity 0.2s; }
        .btn-save:hover { opacity: 0.9; }
        .trade-list { flex: 1; overflow-y: auto; margin-top: 20px; padding-right: 5px; }
        .trade-card { background: #1c212b; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.1s; }
        .trade-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .trade-card strong { color: #fff; font-size: 14px; }
        .trade-card span { font-size: 12px; color: #787b86; display: block; margin-top: 4px; }
        #chart-container { flex: 1; width: 100%; }
        .trade-list::-webkit-scrollbar { width: 4px; }
        .trade-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Journal Pro</h2>
        <input type="text" id="sym" placeholder="Símbolo (Ej: NASDAQ:AAPL o NYSE:NIO)">
        <input type="date" id="date">
        <select id="side"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
        <textarea id="notes" placeholder="Análisis del trade..." rows="3"></textarea>
        <button class="btn-save" onclick="addTrade()">Guardar Registro</button>
        <div class="trade-list" id="list"></div>
    </div>
    <div class="main">
        <div id="chart-container"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let trades = JSON.parse(localStorage.getItem('stocks_journal_v1') || '[]');

        function initChart(symbol) {
            // Limpia el símbolo para asegurar que sea compatible con Stocks
            let cleanSymbol = symbol.toUpperCase().trim();
            
            new TradingView.widget({
                "autosize": true,
                "symbol": cleanSymbol,
                "interval": "5",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "es",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "chart-container"
            });
        }

        function addTrade() {
            const sym = document.getElementById('sym').value.toUpperCase().trim();
            const date = document.getElementById('date').value;
            const side = document.getElementById('side').value;
            const notes = document.getElementById('notes').value;
            if(!sym || !date) return alert("Símbolo y fecha requeridos");

            const trade = { sym, date, side, notes, id: Date.now() };
            trades.unshift(trade);
            localStorage.setItem('stocks_journal_v1', JSON.stringify(trades));
            renderList();
            initChart(sym);
        }

        function renderList() {
            const list = document.getElementById('list');
            list.innerHTML = '';
            trades.forEach(t => {
                const card = document.createElement('div');
                card.className = 'trade-card';
                card.innerHTML = `<strong>${t.sym}</strong><span>${t.side} | ${t.date}</span>`;
                card.onclick = () => {
                    document.getElementById('notes').value = t.notes;
                    initChart(t.sym);
                };
                list.appendChild(card);
            });
        }

        window.onload = () => {
            renderList();
            // Carga AAPL por defecto si no hay trades
            initChart(trades.length > 0 ? trades[0].sym : "NASDAQ:AAPL");
        };
    </script>
</body>
</html>
