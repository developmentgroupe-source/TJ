<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal Pro — Firebase Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e28;--bg4:#222736;
  --border:#2a2f3d;--border2:#363c50;
  --text:#e8eaf0;--text2:#8b90a0;--text3:#555a6a;
  --green:#00d4a0;--green-bg:#00d4a015;
  --red:#ff5566;--red-bg:#ff556610;
  --blue:#4a9eff;--blue-bg:#4a9eff12;
  --font-mono:'IBM Plex Mono',monospace;
  --font-sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px; overflow: hidden;}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;}
.logo{padding:20px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.nav{padding:12px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--blue);background:var(--blue-bg);border-left:3px solid var(--blue)}

/* MAIN AREA */
.main{display: grid; grid-template-rows: 60px 1fr; height: 100vh;}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.content-grid{display: grid; grid-template-columns: 1fr 400px; overflow: hidden;}

/* TRADES LIST */
.trades-container{padding:20px; overflow-y: auto; border-right: 1px solid var(--border);}
.trades-table{width:100%; border-collapse: collapse;}
.trades-table th{text-align:left; color:var(--text3); font-size:10px; text-transform:uppercase; padding:10px; border-bottom:1px solid var(--border)}
.trades-table td{padding:12px 10px; border-bottom:1px solid var(--border); font-size:13px; cursor: pointer;}
.trades-table tr:hover{background: var(--bg2);}

/* CHART & FORM */
.right-panel{display: flex; flex-direction: column; background: var(--bg2);}
.chart-box{height: 50%; border-bottom: 1px solid var(--border); background: #000;}
.form-box{padding: 20px; overflow-y: auto; flex: 1;}

/* ELEMENTS */
.input-group{margin-bottom:15px}
.input-group label{display:block; font-size:10px; color:var(--text3); margin-bottom:5px; text-transform:uppercase}
.input-group input, .input-group textarea, .input-group select{
    width:100%; background:var(--bg3); border:1px solid var(--border); padding:8px; border-radius:5px; color:white; outline:none;
}
.btn-save{width:100%; background:var(--blue); color:white; padding:10px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;}
.pill{padding:2px 6px; border-radius:4px; font-size:11px; font-family:var(--font-mono);}
.win{background:var(--green-bg); color:var(--green)}
.loss{background:var(--red-bg); color:var(--red)}
</style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo"><div class="logo-dot"></div>JOURNAL PRO</div>
        <nav class="nav">
            <div class="nav-item active">▤ Mis trades</div>
            <div class="nav-item">◈ Analítica</div>
            <div class="nav-item">↓ Importar CSV</div>
        </nav>
        <div style="padding:20px; border-top:1px solid var(--border)">
            <div style="font-size:10px; color:var(--text3)">WIN RATE</div>
            <div id="wr-display" style="font-size:20px; font-family:var(--font-mono)">0%</div>
            <div style="font-size:10px; color:var(--text3); margin-top:10px">TOTAL P&L</div>
            <div id="pnl-display" style="font-size:20px; font-family:var(--font-mono)">$0.00</div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div style="font-size:14px; font-weight:500">Dashboard de Operaciones</div>
            <div style="font-size:11px; color:var(--text3)" id="sync-status">Conectado a Firebase</div>
        </header>

        <div class="content-grid">
            <div class="trades-container">
                <table class="trades-table">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>P&L</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="trades-tbody">
                        </tbody>
                </table>
            </div>

            <div class="right-panel">
                <div class="chart-box" id="tv_chart_container">
                    </div>
                <div class="form-box">
                    <h3 style="font-size:12px; margin-bottom:15px; color:var(--blue)">NUEVO REGISTRO</h3>
                    <form id="trade-form">
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                            <div class="input-group">
                                <label>Ticker</label>
                                <input type="text" id="f-ticker" placeholder="AAPL" required>
                            </div>
                            <div class="input-group">
                                <label>Cantidad</label>
                                <input type="number" id="f-qty" value="1">
                            </div>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                            <div class="input-group">
                                <label>Precio Entrada</label>
                                <input type="number" id="f-entry" step="0.01" required>
                            </div>
                            <div class="input-group">
                                <label>Precio Salida</label>
                                <input type="number" id="f-exit" step="0.01" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Notas del Trade</label>
                            <textarea id="f-notes" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn-save">GUARDAR TRADE</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // TU CONFIGURACIÓN REAL DE FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
        authDomain: "trading-journal-ac545.firebaseapp.com",
        projectId: "trading-journal-ac545",
        storageBucket: "trading-journal-ac545.firebasestorage.app",
        messagingSenderId: "113557647477",
        appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // FUNCIÓN PARA CARGAR EL GRÁFICO
    window.updateChart = function(symbol) {
        new TradingView.widget({
            "autosize": true,
            "symbol": symbol.includes(':') ? symbol : "NASDAQ:" + symbol,
            "interval": "D",
            "timezone": "America/New_York",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "container_id": "tv_chart_container",
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
        });
    }

    // CARGA INICIAL
    updateChart("NASDAQ:AAPL");

    // GUARDAR EN FIREBASE
    document.getElementById('trade-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const symbol = document.getElementById('f-ticker').value.toUpperCase();
        const entry = parseFloat(document.getElementById('f-entry').value);
        const exit = parseFloat(document.getElementById('f-exit').value);
        
        try {
            await addDoc(collection(db, "trades"), {
                symbol: symbol,
                entry: entry,
                exit: exit,
                qty: document.getElementById('f-qty').value,
                notes: document.getElementById('f-notes').value,
                timestamp: new Date()
            });
            document.getElementById('trade-form').reset();
            updateChart(symbol);
        } catch (e) { console.error("Error: ", e); }
    });

    // ESCUCHAR TRADES (TIEMPO REAL)
    onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snapshot) => {
        const tbody = document.getElementById('trades-tbody');
        tbody.innerHTML = '';
        let totalPnl = 0;
        let wins = 0;
        let count = 0;

        snapshot.forEach((doc) => {
            const t = doc.data();
            const pnl = (t.exit - t.entry) * (t.qty || 1);
            totalPnl += pnl;
            count++;
            if (pnl > 0) wins++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:bold">${t.symbol}</td>
                <td class="mono">${t.entry}</td>
                <td class="mono">${t.exit}</td>
                <td class="mono ${pnl >= 0 ? 'green' : 'red'}" style="color: ${pnl >= 0 ? '#00d4a0' : '#ff5566'}">$${pnl.toFixed(2)}</td>
                <td><span class="pill ${pnl >= 0 ? 'win' : 'loss'}">${pnl >= 0 ? 'WIN' : 'LOSS'}</span></td>
            `;
            tr.onclick = () => updateChart(t.symbol);
            tbody.appendChild(tr);
        });

        // ACTUALIZAR SIDEBAR
        document.getElementById('wr-display').innerText = count > 0 ? Math.round((wins/count)*100) + "%" : "0%";
        document.getElementById('pnl-display').innerText = "$" + totalPnl.toFixed(2);
        document.getElementById('pnl-display').style.color = totalPnl >= 0 ? '#00d4a0' : '#ff5566';
    });
</script>
</body>
</html>
