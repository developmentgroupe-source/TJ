<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trading Journal Pro</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #0b0e14; --panel: #151921; --border: #242933; --text: #d1d4dc; --accent: #2962ff; --green: #089981; --red: #f23645; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .main { flex: 1; display: flex; flex-direction: column; }
        #chart { flex: 1; background: #000; margin: 15px; border-radius: 8px; border: 1px solid var(--border); }
        input, select { background: #1e222d; border: 1px solid var(--border); color: white; padding: 12px; margin-bottom: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; }
        .trade-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; background: #1c212b; margin-bottom: 8px; border-radius: 6px; }
        .status { font-size: 12px; margin-bottom: 15px; padding: 10px; border-radius: 6px; background: #000; text-align: center; color: var(--green); border: 1px solid var(--green); }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--accent); margin:0 0 15px 0;">Journal Pro</h2>
    <div class="status">● SISTEMA LISTO</div>
    
    <input type="text" id="t-sym" placeholder="Símbolo (BTC/USD, AAPL)">
    <input type="date" id="t-date">
    <select id="t-side">
        <option value="buy">LONG (Compra)</option>
        <option value="sell">SHORT (Venta)</option>
    </select>
    <button class="btn" onclick="addTrade()">Añadir Trade</button>

    <div style="margin-top:20px; overflow-y:auto; flex:1">
        <div id="list"></div>
    </div>
</div>

<div class="main"><div id="chart"></div></div>

<script>
    // PEGA TU CLAVE AQUÍ ABAJO
    const API_KEY = "f555d5dc66dc44e19c96376985c8da49"; 

    let trades = JSON.parse(localStorage.getItem('journal_v5_data') || '[]');
    let chart, candleSeries;

    function init() {
        chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#000000' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#131722' }, horzLines: { color: '#131722' } },
            timeScale: { timeVisible: true }
        });
        candleSeries = chart.addCandlestickSeries({ upColor: '#089981', downColor: '#f23645' });
        document.getElementById('t-date').value = new Date().toISOString().split('T')[0];
        renderList();
    }

    async function addTrade() {
        const sym = document.getElementById('t-sym').value.toUpperCase().trim();
        const date = document.getElementById('t-date').value;
        const side = document.getElementById('t-side').value;
        if(!sym) return alert("Pon un símbolo");

        const newTrade = { sym, date, side, id: Date.now() };
        trades.unshift(newTrade);
        localStorage.setItem('journal_v5_data', JSON.stringify(trades));
        renderList();
        loadChart(newTrade);
    }

    async function loadChart(trade) {
        try {
            const res = await fetch(`https://api.twelvedata.com/time_series?symbol=${trade.sym}&interval=1h&apikey=${API_KEY}&outputsize=100&order=ASC`);
            const data = await res.json();
            if(data.status === "error") throw new Error(data.message);

            const bars = data.values.map(v => ({
                time: new Date(v.datetime).getTime() / 1000,
                open: parseFloat(v.open), high: parseFloat(v.high), low: parseFloat(v.low), close: parseFloat(v.close)
            }));
            candleSeries.setData(bars);
            
            candleSeries.setMarkers([{
                time: new Date(trade.date).getTime() / 1000,
                position: trade.side === 'buy' ? 'belowBar' : 'aboveBar',
                color: trade.side === 'buy' ? '#089981' : '#f23645',
                shape: trade.side === 'buy' ? 'arrowUp' : 'arrowDown',
                text: 'ENTRY'
            }]);
            chart.timeScale().fitContent();
        } catch(e) { alert("Error: " + e.message); }
    }

    function renderList() {
        const container = document.getElementById('list');
        container.innerHTML = '';
        trades.forEach(t => {
            const d = document.createElement('div');
            d.className = 'trade-item';
            d.innerHTML = `<b>${t.sym}</b><br><small>${t.date} · ${t.side.toUpperCase()}</small>`;
            d.onclick = () => loadChart(t);
            container.appendChild(d);
        });
    }

    init();
</script>
</body>
</html>
