<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e28;--bg4:#222736;
  --border:#2a2f3d;--text:#e8eaf0;--text2:#8b90a0;--text3:#555a6a;
  --blue:#4a9eff;--blue-bg:#4a9eff12;--green:#00d4a0;--red:#ff5566;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:13px}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.nav-item{padding:12px 20px;cursor:pointer;color:var(--text2);border-left:3px solid transparent}
.nav-item.active{color:var(--blue);border-left-color:var(--blue);background:var(--blue-bg)}

/* MAIN AREA */
.main{position:relative;display:flex;flex-direction:column;overflow:hidden}
.content{padding:24px 28px;overflow-y:auto;flex:1}
.page{display:none}.page.active{display:block}

/* FORM STYLES (EXACT MATCH TO IMAGE) */
.form-container{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:24px}
.form-row{display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:8px}
.label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.input, .select, .textarea{
    background:var(--bg3);border:1px solid var(--border);border-radius:4px;
    color:var(--text);padding:10px;outline:none;font-family:inherit;
}
.input:focus{border-color:var(--blue)}

/* SETUP TAGS */
.setup-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag{
    padding:4px 10px;background:var(--bg4);border:1px solid var(--border);
    border-radius:4px;cursor:pointer;font-size:11px;color:var(--text2);
}
.tag.selected{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}

/* FOOTER BUTTONS */
.form-footer{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);display:flex;gap:12px}
.btn-save{background:var(--blue);color:white;border:none;padding:10px 24px;border-radius:4px;cursor:pointer;font-weight:500}
.btn-cancel{background:transparent;color:var(--text2);border:1px solid var(--border);padding:10px 24px;border-radius:4px;cursor:pointer}

/* TABLE STYLES */
.trades-table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--border)}
.trades-table th{padding:12px;text-align:left;color:var(--text3);font-size:10px;border-bottom:1px solid var(--border)}
.trades-table td{padding:12px;border-bottom:1px solid var(--border);cursor:pointer}

#chart-container-full{display:none;position:absolute;inset:0;background:var(--bg);z-index:50;flex-direction:column}
</style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div style="padding:20px; font-weight:bold; letter-spacing:2px">JOURNAL</div>
        <nav class="nav">
            <div class="nav-item active" onclick="showPage('trades', this)">Mis trades</div>
            <div class="nav-item" onclick="showPage('new', this)">Nuevo trade</div>
        </nav>
    </aside>

    <main class="main">
        <div class="content">
            <div id="page-trades" class="page active">
                <table class="trades-table">
                    <thead><tr><th>FECHA</th><th>TICKER</th><th>ENTRADA</th><th>SALIDA</th><th>P&L $</th><th>ESTADO</th><th>ACCIONES</th></tr></thead>
                    <tbody id="trades-tbody"></tbody>
                </table>
            </div>

            <div id="page-new" class="page">
                <div class="form-container">
                    <form id="trade-form">
                        <input type="hidden" id="f-id">
                        
                        <div class="form-row">
                            <div class="form-group"><label class="label">Ticker *</label><input type="text" id="f-sym" class="input" placeholder="GOOGL" required></div>
                            <div class="form-group">
                                <label class="label">Dirección *</label>
                                <select id="f-dir" class="select"><option value="Long">Long</option><option value="Short">Short</option></select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group"><label class="label">Fecha Entrada</label><input type="date" id="f-date-in" class="input"></div>
                            <div class="form-group"><label class="label">Hora Entrada</label><input type="time" id="f-time-in" class="input"></div>
                            <div class="form-group"><label class="label">Precio Entrada *</label><input type="number" step="0.01" id="f-entry" class="input" required></div>
                        </div>

                        <div class="form-row">
                            <div class="form-group"><label class="label">Fecha Salida</label><input type="date" id="f-date-out" class="input"></div>
                            <div class="form-group"><label class="label">Hora Salida</label><input type="time" id="f-time-out" class="input"></div>
                            <div class="form-group"><label class="label">Precio Salida</label><input type="number" step="0.01" id="f-exit" class="input" placeholder="Vacío = Abierto"></div>
                        </div>

                        <div class="form-row">
                            <div class="form-group"><label class="label">Cantidad *</label><input type="number" id="f-qty" class="input" value="100"></div>
                            <div class="form-group"><label class="label">Stop Loss</label><input type="number" step="0.01" id="f-sl" class="input"></div>
                            <div class="form-group"><label class="label">Comisión ($)</label><input type="number" step="0.01" id="f-comm" class="input" value="0"></div>
                        </div>

                        <div class="form-group" style="margin-bottom:20px">
                            <label class="label">Setup</label>
                            <div class="setup-tags" id="setup-list">
                                <div class="tag" onclick="toggleTag(this)">Gap & Go</div>
                                <div class="tag" onclick="toggleTag(this)">Breakout</div>
                                <div class="tag" onclick="toggleTag(this)">Pullback</div>
                                <div class="tag" onclick="toggleTag(this)">VWAP</div>
                                <div class="tag" onclick="toggleTag(this)">Reversal</div>
                            </div>
                            <input type="text" id="f-setup-custom" class="input" style="margin-top:10px" placeholder="O escribe tu setup...">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="label">Timeframe</label>
                                <select id="f-tf" class="select"><option value="1m">1m</option><option value="5m" selected>5m</option><option value="15m">15m</option><option value="1D">1D</option></select>
                            </div>
                            <div class="form-group">
                                <label class="label">Exchange</label>
                                <select id="f-ex" class="select"><option value="NASDAQ">NASDAQ</option><option value="NYSE">NYSE</option><option value="BINANCE">BINANCE</option></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="label">Notas / Razón de entrada</label>
                            <textarea id="f-notes" class="textarea" rows="3" placeholder="¿Qué viste en el chart?"></textarea>
                        </div>

                        <div class="form-footer">
                            <button type="submit" id="btn-submit" class="btn-save">Guardar trade</button>
                            <button type="button" class="btn-cancel" onclick="showPage('trades')">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="chart-container-full">
            <div style="padding:10px; background:var(--bg2); display:flex; justify-content:space-between">
                <span id="chart-title"></span>
                <button onclick="closeChart()" style="color:white; background:none; border:1px solid var(--border); padding:2px 10px; cursor:pointer">Cerrar</button>
            </div>
            <div id="tv-div" style="flex:1"></div>
        </div>
    </main>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
        authDomain: "trading-journal-ac545.firebaseapp.com",
        projectId: "trading-journal-ac545",
        storageBucket: "trading-journal-ac545.firebasestorage.app",
        messagingSenderId: "113557647477",
        appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.showPage = (id, el) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(el) el.classList.add('active');
        if(id === 'new' && !document.getElementById('f-id').value) {
            document.getElementById('trade-form').reset();
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
        }
    };

    window.toggleTag = (el) => el.classList.toggle('selected');

    window.openChart = (sym) => {
        document.getElementById('chart-container-full').style.display = 'flex';
        new TradingView.widget({ "autosize": true, "symbol": sym, "interval": "5", "theme": "dark", "container_id": "tv-div" });
    };
    window.closeChart = () => document.getElementById('chart-container-full').style.display = 'none';

    document.getElementById('trade-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('f-id').value;
        const selectedTags = Array.from(document.querySelectorAll('.tag.selected')).map(t => t.innerText);
        
        const data = {
            symbol: document.getElementById('f-sym').value.toUpperCase(),
            direction: document.getElementById('f-dir').value,
            dateIn: document.getElementById('f-date-in').value,
            timeIn: document.getElementById('f-time-in').value,
            entry: parseFloat(document.getElementById('f-entry').value),
            dateOut: document.getElementById('f-date-out').value,
            timeOut: document.getElementById('f-time-out').value,
            exit: parseFloat(document.getElementById('f-exit').value) || null,
            qty: parseFloat(document.getElementById('f-qty').value),
            sl: parseFloat(document.getElementById('f-sl').value) || null,
            comm: parseFloat(document.getElementById('f-comm').value) || 0,
            setup: selectedTags.join(', ') || document.getElementById('f-setup-custom').value,
            tf: document.getElementById('f-tf').value,
            exchange: document.getElementById('f-ex').value,
            notes: document.getElementById('f-notes').value,
            timestamp: new Date()
        };

        id ? await updateDoc(doc(db, "trades", id), data) : await addDoc(collection(db, "trades"), data);
        showPage('trades', document.querySelectorAll('.nav-item')[0]);
    });

    window.editTrade = (id, data, e) => {
        e.stopPropagation();
        document.getElementById('f-id').value = id;
        document.getElementById('f-sym').value = data.symbol;
        document.getElementById('f-entry').value = data.entry;
        document.getElementById('f-exit').value = data.exit || '';
        document.getElementById('f-qty').value = data.qty;
        document.getElementById('f-notes').value = data.notes || '';
        document.getElementById('btn-submit').innerText = "Actualizar Trade";
        showPage('new');
    };

    onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snap) => {
        const tbody = document.getElementById('trades-tbody');
        tbody.innerHTML = '';
        snap.forEach(d => {
            const t = d.data();
            const pnl = t.exit ? (t.exit - t.entry) * t.qty - t.comm : 0;
            const tr = document.createElement('tr');
            tr.onclick = () => openChart(t.symbol);
            tr.innerHTML = `
                <td>${t.dateIn || '-'}</td>
                <td style="font-weight:bold">${t.symbol}</td>
                <td>${t.entry}</td>
                <td>${t.exit || 'OPEN'}</td>
                <td style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${pnl.toFixed(2)}</td>
                <td>${pnl >= 0 ? 'WIN' : 'LOSS'}</td>
                <td><span onclick="editTrade('${d.id}', ${JSON.stringify(t).replace(/"/g, '&quot;')}, event)" style="color:var(--blue)">Edit</span></td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>
</body>
</html>
