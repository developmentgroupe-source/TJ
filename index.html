<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trading Journal Pro</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #0b0e14; --panel: #151921; --border: #242933; --text: #d1d4dc; --accent: #2962ff; --green: #089981; --red: #f23645; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .main { flex: 1; display: flex; flex-direction: column; }
        #chart { flex: 1; background: #000; margin: 15px; border-radius: 8px; border: 1px solid var(--border); }
        input, select { background: #1e222d; border: 1px solid var(--border); color: white; padding: 12px; margin-bottom: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; }
        .trade-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; background: #1c212b; margin-bottom: 8px; border-radius: 6px; }
        #debug-msg { font-size: 11px; color: #ffb340; margin-top: 10px; font-family: monospace; text-align: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--accent); margin:0 0 15px 0;">Journal Pro</h2>
    
    <input type="text" id="t-sym" placeholder="Símbolo (AAPL, BTC/USD)">
    <input type="date" id="t-date">
    <select id="t-side"><option value="buy">BUY / LONG</option><option value="sell">SELL / SHORT</option></select>
    <button class="btn" onclick="addTrade()">Visualizar Trade</button>

    <div id="debug-msg">Sistema Iniciado</div>

    <div style="margin-top:20px; overflow-y:auto; flex:1"><div id="list"></div></div>
</div>

<div class="main"><div id="chart"></div></div>

<script>
    // 1. CONFIGURACIÓN (REEMPLAZA ESTA KEY)
    const API_KEY = "f555d5dc66dc44e19c96376985c8da49"; 

    // 2. INICIALIZACIÓN GLOBAL E INMEDIATA DEL GRÁFICO
    const chartContainer = document.getElementById('chart');
    const chart = LightweightCharts.createChart(chartContainer, {
        layout: { background: { color: '#000000' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#131722' }, horzLines: { color: '#131722' } },
        timeScale: { timeVisible: true, borderVisible: false }
    });
    
    // Creamos la serie de velas inmediatamente para que esté disponible siempre
    const candleSeries = chart.addCandlestickSeries({ 
        upColor: '#089981', 
        downColor: '#f23645',
        borderVisible: false,
        wickUpColor: '#089981',
        wickDownColor: '#f23645'
    });

    let trades = JSON.parse(localStorage.getItem('journal_v8') || '[]');

    function setDebug(msg, color = "#ffb340") {
        const el = document.getElementById('debug-msg');
        el.innerText = msg;
        el.style.color = color;
    }

    async function addTrade() {
        const sym = document.getElementById('t-sym').value.toUpperCase().trim();
        const date = document.getElementById('t-date').value;
        const side = document.getElementById('t-side').value;
        if(!sym) return alert("Por favor, ingresa un símbolo.");

        const newTrade = { sym, date, side, id: Date.now() };
        trades.unshift(newTrade);
        localStorage.setItem('journal_v8', JSON.stringify(trades));
        renderList();
        loadChart(newTrade);
    }

    async function loadChart(trade) {
        setDebug(`Cargando ${trade.sym}...`);
        
        try {
            // Usamos intervalo diario para máxima compatibilidad
            const url = `https://api.twelvedata.com/time_series?symbol=${trade.sym}&interval=1day&apikey=${API_KEY}&outputsize=150&order=ASC`;
            const res = await fetch(url);
            const data = await res.json();
            
            if(data.status === "error") {
                setDebug(`Error: ${data.message}`, "#f23645");
                return;
            }

            if(!data.values) {
                setDebug("Símbolo no encontrado.", "#f23645");
                return;
            }

            const bars = data.values.map(v => ({
                time: v.datetime, 
                open: parseFloat(v.open), 
                high: parseFloat(v.high), 
                low: parseFloat(v.low), 
                close: parseFloat(v.close)
            }));
            
            // Aquí ya no dará error porque candleSeries se definió al inicio
            candleSeries.setData(bars);
            
            // Colocar marcador del trade
            candleSeries.setMarkers([{
                time: trade.date,
                position: trade.side === 'buy' ? 'belowBar' : 'aboveBar',
                color: trade.side === 'buy' ? '#089981' : '#f23645',
                shape: trade.side === 'buy' ? 'arrowUp' : 'arrowDown',
                text: trade.side.toUpperCase()
            }]);

            chart.timeScale().fitContent();
            setDebug("¡Éxito! Gráfico actualizado.", "#089981");

        } catch(e) { 
            setDebug(`Error de red: ${e.message}`, "#f23645"); 
        }
    }

    function renderList() {
        const container = document.getElementById('list');
        container.innerHTML = '<b>HISTORIAL:</b><br><br>';
        trades.forEach(t => {
            const d = document.createElement('div');
            d.className = 'trade-item';
            d.innerHTML = `<b>${t.sym}</b> - ${t.side.toUpperCase()}<br><small>${t.date}</small>`;
            d.onclick = () => loadChart(t);
            container.appendChild(d);
        });
    }

    // Ajustar gráfico si se cambia el tamaño de la ventana
    window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartContainer.clientWidth });
    });

    // Cargar trades guardados al iniciar
    document.getElementById('t-date').value = new Date().toISOString().split('T')[0];
    renderList();
</script>
</body>
</html>
