<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal — Firebase Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e28;--bg4:#222736;
  --border:#2a2f3d;--border2:#363c50;
  --text:#e8eaf0;--text2:#8b90a0;--text3:#555a6a;
  --green:#00d4a0;--green-bg:#00d4a015;
  --red:#ff5566;--red-bg:#ff556610;
  --blue:#4a9eff;--blue-bg:#4a9eff12;
  --font-mono:'IBM Plex Mono',monospace;
  --font-sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overflow:hidden}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
.logo{padding:20px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.nav{padding:12px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--text2);font-size:13px;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--blue);border-left-color:var(--blue);background:var(--blue-bg)}

/* MAIN */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between}
.content{padding:24px 28px;overflow-y:auto;flex:1}
.page{display:none}.page.active{display:block}

/* TABLES & STATS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.metric-val{font-family:var(--font-mono);font-size:20px;font-weight:500}
.trades-table{width:100%;border-collapse:collapse}
.trades-table th{padding:10px 16px;text-align:left;font-size:10px;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border);font-family:var(--font-mono)}
.trades-table td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.trades-table tr:hover{background:var(--bg3)}

/* MODAL CHART FULLSCREEN */
#chart-modal{display:none;position:fixed;inset:0;background:var(--bg);z-index:1000;flex-direction:column}
.chart-header{height:50px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 12px;outline:none}
.btn-primary{background:var(--blue);color:white;padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}

.pill-win{color:var(--green);background:var(--green-bg);padding:2px 8px;border-radius:4px;font-size:11px}
.pill-loss{color:var(--red);background:var(--red-bg);padding:2px 8px;border-radius:4px;font-size:11px}
</style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo"><div class="logo-dot"></div>JOURNAL</div>
        <nav class="nav">
            <div class="nav-item active" onclick="showPage('trades', this)">Mis trades</div>
            <div class="nav-item" onclick="showPage('new', this)">Nuevo trade</div>
            <div class="nav-item" onclick="showPage('analytics', this)">Analítica</div>
        </nav>
        <div style="padding:20px; border-top:1px solid var(--border)">
            <div style="font-size:10px; color:var(--text3)">NET P&L</div>
            <div id="side-pnl" style="font-size:18px; font-family:var(--font-mono)">$0.00</div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div id="page-title" style="font-size:15px; font-weight:500">Mis trades</div>
        </header>

        <div class="content">
            <div id="page-trades" class="page active">
                <div class="metrics-grid">
                    <div class="metric"><div class="metric-label">Win Rate</div><div id="m-wr" class="metric-val">0%</div></div>
                    <div class="metric"><div class="metric-label">Trades</div><div id="m-count" class="metric-val">0</div></div>
                    <div class="metric"><div class="metric-label">Net P&L</div><div id="m-pnl" class="metric-val">$0.00</div></div>
                </div>
                <div style="background:var(--bg2); border:1px solid var(--border); border-radius:8px">
                    <table class="trades-table">
                        <thead><tr><th>Ticker</th><th>Entrada</th><th>Salida</th><th>P&L $</th><th>Estado</th></tr></thead>
                        <tbody id="trades-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-new" class="page">
                <div style="background:var(--bg2); border:1px solid var(--border); border-radius:8px; max-width:600px">
                    <form id="trade-form">
                        <div class="form-grid">
                            <div class="form-group"><label style="font-size:10px;color:var(--text3)">Ticker</label><input type="text" id="f-sym" class="form-input" required></div>
                            <div class="form-group"><label style="font-size:10px;color:var(--text3)">Cantidad</label><input type="number" id="f-qty" class="form-input" value="1"></div>
                            <div class="form-group"><label style="font-size:10px;color:var(--text3)">Entrada</label><input type="number" step="0.01" id="f-entry" class="form-input" required></div>
                            <div class="form-group"><label style="font-size:10px;color:var(--text3)">Salida</label><input type="number" step="0.01" id="f-exit" class="form-input" required></div>
                        </div>
                        <div style="padding:20px; border-top:1px solid var(--border)">
                            <button type="submit" class="btn-primary">Guardar Trade</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="page-analytics" class="page">
                <div class="metric" style="height:300px; display:flex; align-items:center; justify-content:center; color:var(--text3)">
                    Estadísticas detalladas próximamente...
                </div>
            </div>
        </div>
    </main>
</div>

<div id="chart-modal">
    <div class="chart-header">
        <div id="chart-sym-display" style="font-family:var(--font-mono); color:var(--blue)"></div>
        <button onclick="closeChart()" style="background:none; border:1px solid var(--border); color:white; padding:5px 10px; cursor:pointer">Cerrar [X]</button>
    </div>
    <div id="tv-container" style="flex:1"></div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
        authDomain: "trading-journal-ac545.firebaseapp.com",
        projectId: "trading-journal-ac545",
        storageBucket: "trading-journal-ac545.firebasestorage.app",
        messagingSenderId: "113557647477",
        appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // NAVEGACIÓN
    window.showPage = (pageId, el) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('page-title').innerText = el.innerText;
    };

    // GRÁFICO FULLSCREEN
    window.openChart = (symbol) => {
        document.getElementById('chart-modal').style.display = 'flex';
        document.getElementById('chart-sym-display').innerText = symbol;
        new TradingView.widget({
            "autosize": true,
            "symbol": symbol.includes(':') ? symbol : "NASDAQ:" + symbol,
            "interval": "D",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "container_id": "tv-container",
            "hide_side_toolbar": false,
            "allow_symbol_change": true
        });
    };
    window.closeChart = () => document.getElementById('chart-modal').style.display = 'none';

    // GUARDAR
    document.getElementById('trade-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await addDoc(collection(db, "trades"), {
            symbol: document.getElementById('f-sym').value.toUpperCase(),
            qty: parseFloat(document.getElementById('f-qty').value),
            entry: parseFloat(document.getElementById('f-entry').value),
            exit: parseFloat(document.getElementById('f-exit').value),
            timestamp: new Date()
        });
        document.getElementById('trade-form').reset();
        showPage('trades', document.querySelectorAll('.nav-item')[0]);
    });

    // CARGAR TRADES
    onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snap) => {
        const tbody = document.getElementById('trades-tbody');
        tbody.innerHTML = '';
        let totalPnl = 0, wins = 0, count = 0;

        snap.forEach(doc => {
            const t = doc.data();
            const pnl = (t.exit - t.entry) * (t.qty || 1);
            totalPnl += pnl; count++;
            if(pnl > 0) wins++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:bold; color:white">${t.symbol}</td>
                <td class="font-mono">${t.entry}</td>
                <td class="font-mono">${t.exit}</td>
                <td class="font-mono" style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${pnl.toFixed(2)}</td>
                <td><span class="${pnl >= 0 ? 'pill-win' : 'pill-loss'}">${pnl >= 0 ? 'WIN' : 'LOSS'}</span></td>
            `;
            tr.onclick = () => openChart(t.symbol);
            tbody.appendChild(tr);
        });

        // ACTUALIZAR METRICAS
        document.getElementById('m-wr').innerText = count > 0 ? Math.round((wins/count)*100)+'%' : '0%';
        document.getElementById('m-count').innerText = count;
        document.getElementById('m-pnl').innerText = '$' + totalPnl.toFixed(2);
        document.getElementById('side-pnl').innerText = '$' + totalPnl.toFixed(2);
        document.getElementById('side-pnl').style.color = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
    });
</script>
</body>
</html>
