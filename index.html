<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Trading Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400 tracking-tight">Trading<span class="text-white">Journal</span>.pro</h1>
            <div id="connection-status" class="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30">Conectado a Firebase</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <h2 class="text-xl font-semibold mb-4 text-blue-300">Nuevo Trade</h2>
                    <form id="trade-form" class="space-y-4">
                        <input type="text" id="symbol" placeholder="Símbolo (ej: NVDA)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 uppercase" required>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="entry" step="0.01" placeholder="Entrada" class="bg-slate-900 border border-slate-700 rounded-lg p-3 focus:outline-none" required>
                            <input type="number" id="exit" step="0.01" placeholder="Salida" class="bg-slate-900 border border-slate-700 rounded-lg p-3 focus:outline-none" required>
                        </div>
                        <input type="text" id="chart-url" placeholder="Link del Gráfico (TradingView)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 focus:outline-none">
                        <textarea id="notes" placeholder="¿Qué viste en el precio?" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 h-24 focus:outline-none"></textarea>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-blue-900/20">Guardar Trade</button>
                    </form>
                </div>

                <div id="trades-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                    </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="glass rounded-2xl overflow-hidden h-[600px] relative">
                    <div id="tradingview_widget" class="h-full"></div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN QUE SACAMOS DE TU CAPTURA
        const firebaseConfig = {
            apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
            authDomain: "trading-journal-ac545.firebaseapp.com",
            projectId: "trading-journal-ac545",
            storageBucket: "trading-journal-ac545.firebasestorage.app",
            messagingSenderId: "113557647477",
            appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // LÓGICA DE TRADINGVIEW
        function loadChart(symbol = 'NASDAQ:NVDA') {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "America/New_York",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_widget"
            });
        }

        // GUARDAR TRADE
        document.getElementById('trade-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const symbol = document.getElementById('symbol').value.toUpperCase();
            
            try {
                await addDoc(collection(db, "trades"), {
                    symbol: symbol,
                    entry: document.getElementById('entry').value,
                    exit: document.getElementById('exit').value,
                    chart: document.getElementById('chart-url').value,
                    notes: document.getElementById('notes').value,
                    timestamp: new Date()
                });
                document.getElementById('trade-form').reset();
                loadChart(symbol);
            } catch (error) {
                console.error("Error al guardar:", error);
            }
        });

        // LEER TRADES EN TIEMPO REAL
        onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snapshot) => {
            const list = document.getElementById('trades-list');
            list.innerHTML = '';
            snapshot.forEach((doc) => {
                const trade = doc.data();
                const profit = trade.exit - trade.entry;
                const color = profit >= 0 ? 'text-green-400' : 'text-red-400';
                
                list.innerHTML += `
                    <div class="glass p-4 rounded-xl cursor-pointer hover:border-blue-500 transition" onclick="window.loadSpecificChart('${trade.symbol}')">
                        <div class="flex justify-between font-bold uppercase">
                            <span>${trade.symbol}</span>
                            <span class="${color}">${profit.toFixed(2)}$</span>
                        </div>
                        <p class="text-xs text-slate-400 truncate mt-1">${trade.notes || 'Sin notas'}</p>
                    </div>
                `;
            });
        });

        window.loadSpecificChart = loadChart;
        loadChart(); // Carga inicial
    </script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</body>
</html>
