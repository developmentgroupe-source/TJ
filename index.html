<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingJournal.pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e11; --bg-sidebar: #12151c; --bg-card: #161a23; --bg-input: #1c212d;
            --border: #2a2f3d; --accent: #3b82f6; --text-main: #e5e7eb; --text-dim: #9ca3af;
            --green: #00d4a0; --red: #ff5566; --font-sans: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; }
        .app-container { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

        /* SIDEBAR */
        .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; z-index: 100; }
        .logo { padding: 0 24px 30px; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .logo span { color: var(--green); }
        .nav-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--text-dim); transition: 0.2s; font-size: 14px; }
        .nav-item:hover { background: #ffffff05; color: #fff; }
        .nav-item.active { color: var(--accent); background: #3b82f610; border-left: 3px solid var(--accent); }
        .sidebar-footer { padding: 20px 24px; border-top: 1px solid var(--border); margin-top: auto; }

        /* CONTENT */
        .main-content { display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .top-bar { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); z-index: 10; }
        .content-area { padding: 0 30px 40px; }
        .page { display: none; }
        .page.active { display: block; }

        /* CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 18px; border-radius: 6px; }
        .stat-card label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 8px; }
        .stat-card .val { font-family: var(--font-mono); font-size: 18px; font-weight: 600; }

        /* TABLE */
        .table-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .trades-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .trades-table th { background: #1c212d; padding: 12px; text-align: left; color: var(--text-dim); font-size: 10px; }
        .trades-table td { padding: 14px 12px; border-bottom: 1px solid var(--border); }
        .badge { padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .badge-win { background: #00d4a020; color: var(--green); }
        .badge-loss { background: #ff556620; color: var(--red); }

        /* FORM */
        .form-container { background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border); max-width: 1000px; }
        .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input, .select, .textarea { background: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 4px; outline: none; }
        .tag-btn { padding: 6px 12px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; cursor: pointer; font-size: 11px; }
        .tag-btn.active { background: var(--accent); color: white; }

        /* TRADE DETAIL VIEW */
        #trade-detail-view {
            position: fixed; top: 0; left: 240px; right: 0; bottom: 0;
            background: var(--bg-main); z-index: 200; display: none;
            grid-template-columns: 1fr 380px;
        }
        .detail-main { border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .chart-area { flex: 1; background: #000; }
        .detail-sidebar { padding: 30px; overflow-y: auto; background: var(--bg-sidebar); }
        .detail-info-block { margin-bottom: 25px; }
        .detail-info-block label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
        .detail-info-block p { font-family: var(--font-mono); font-size: 15px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">JOURNAL<span>.pro</span></div>
        <nav>
            <div class="nav-item active" onclick="nav('trades')">Mis trades</div>
            <div class="nav-item" onclick="resetForm(); nav('new-trade')">+ Nuevo trade</div>
            <div class="nav-item" onclick="nav('analytics')">Analítica</div>
        </nav>
        <div class="sidebar-footer">
            <div id="side-pnl" style="font-family: var(--font-mono); font-size: 18px;">$0.00</div>
            <div style="font-size: 10px; color: var(--text-dim)">P&L NETO</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h2 id="page-title">Mis trades</h2>
            <button class="tag-btn" style="background:var(--accent); color:white" onclick="resetForm(); nav('new-trade')">+ Nuevo Trade</button>
        </div>

        <div class="content-area">
            <div id="p-trades" class="page active">
                <div class="stats-grid" id="stats-summary">
                    <div class="stat-card"><label>P&L Total</label><div class="val" id="st-pnl">$0.00</div></div>
                    <div class="stat-card"><label>Win Rate</label><div class="val" id="st-wr">0%</div></div>
                    <div class="stat-card"><label>Total Trades</label><div class="val" id="st-count">0</div></div>
                </div>
                <div class="table-box">
                    <table class="trades-table">
                        <thead>
                            <tr><th>Fecha</th><th>Ticker</th><th>Dir</th><th>Entrada</th><th>Salida</th><th>P&L $</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="trades-list"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-new-trade" class="page">
                <div class="form-container">
                    <form id="trade-form">
                        <input type="hidden" id="f-id">
                        <div class="input-row">
                            <div class="input-group"><label>Ticker *</label><input type="text" id="f-ticker" class="input" required></div>
                            <div class="input-group"><label>Dirección</label><select id="f-dir" class="select"><option>Long</option><option>Short</option></select></div>
                            <div class="input-group"><label>Cantidad</label><input type="number" id="f-qty" class="input" value="100"></div>
                        </div>
                        <div class="input-row">
                            <div class="input-group"><label>Precio Entrada</label><input type="number" step="any" id="f-p-in" class="input" required></div>
                            <div class="input-group"><label>Precio Salida</label><input type="number" step="any" id="f-p-out" class="input"></div>
                            <div class="input-group"><label>Comisión</label><input type="number" step="any" id="f-comm" class="input" value="0"></div>
                        </div>
                        <div class="input-group"><label>Setups</label>
                            <div class="tag-row" id="setup-tags">
                                <button type="button" class="tag-btn" onclick="this.classList.toggle('active')">Gap & Go</button>
                                <button type="button" class="tag-btn" onclick="this.classList.toggle('active')">Breakout</button>
                                <button type="button" class="tag-btn" onclick="this.classList.toggle('active')">Pullback</button>
                            </div>
                        </div>
                        <div class="input-group" style="margin-top:20px"><label>Notas</label><textarea id="f-notes" class="textarea" rows="4"></textarea></div>
                        <div style="margin-top:25px; display:flex; gap:10px">
                            <button type="submit" class="tag-btn" style="background:var(--accent); color:white; padding:10px 30px" id="btn-save">Guardar Trade</button>
                            <button type="button" class="tag-btn" onclick="nav('trades')">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="trade-detail-view">
            <div class="detail-main">
                <div style="padding:15px 25px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
                    <h3 id="det-ticker-title">TRADE DETAIL</h3>
                    <button class="tag-btn" onclick="closeDetail()">Cerrar</button>
                </div>
                <div class="chart-area" id="tv-widget"></div>
            </div>
            <aside class="detail-sidebar">
                <div style="margin-bottom:30px; display:flex; gap:10px">
                    <button class="tag-btn" id="btn-edit-action" style="flex:1">Editar</button>
                    <button class="tag-btn" id="btn-delete-action" style="flex:1; border-color:var(--red); color:var(--red)">Eliminar</button>
                </div>
                <div class="detail-info-block"><label>P&L Realizado</label><p id="det-pnl" style="font-size:24px"></p></div>
                <div class="detail-info-block"><label>Entrada / Salida</label><p id="det-prices"></p></div>
                <div class="detail-info-block" style="border:none"><label>Notas</label><p id="det-notes" style="font-family:var(--font-sans); color:var(--text-dim); line-height:1.6"></p></div>
            </aside>
        </div>
    </main>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
        authDomain: "trading-journal-ac545.firebaseapp.com",
        projectId: "trading-journal-ac545",
        storageBucket: "trading-journal-ac545.firebasestorage.app",
        messagingSenderId: "113557647477",
        appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentTrades = [];

    // NAVEGACION
    window.nav = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('p-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById('page-title').innerText = id === 'trades' ? 'Mis trades' : (id === 'new-trade' ? 'Nuevo Trade' : 'Analítica');
    };

    window.resetForm = () => {
        document.getElementById('trade-form').reset();
        document.getElementById('f-id').value = "";
        document.getElementById('btn-save').innerText = "Guardar Trade";
        document.querySelectorAll('#setup-tags .tag-btn').forEach(b => b.classList.remove('active'));
    };

    // GUARDAR / ACTUALIZAR
    document.getElementById('trade-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('f-id').value;
        const tags = Array.from(document.querySelectorAll('#setup-tags .tag-btn.active')).map(b => b.innerText);
        
        const data = {
            ticker: document.getElementById('f-ticker').value.toUpperCase(),
            dir: document.getElementById('f-dir').value,
            qty: parseFloat(document.getElementById('f-qty').value),
            pIn: parseFloat(document.getElementById('f-p-in').value),
            pOut: parseFloat(document.getElementById('f-p-out').value) || null,
            comm: parseFloat(document.getElementById('f-comm').value) || 0,
            notes: document.getElementById('f-notes').value,
            setups: tags,
            timestamp: new Date()
        };

        id ? await updateDoc(doc(db, "trades", id), data) : await addDoc(collection(db, "trades"), data);
        nav('trades');
    });

    // ESCUCHAR DATOS
    onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snap) => {
        const list = document.getElementById('trades-list');
        list.innerHTML = "";
        let totalPnl = 0, wins = 0;
        currentTrades = [];

        snap.forEach(d => {
            const t = { id: d.id, ...d.data() };
            currentTrades.push(t);
            const pnl = t.pOut ? (t.dir === 'Long' ? (t.pOut - t.pIn) : (t.pIn - t.pOut)) * t.qty - t.comm : 0;
            totalPnl += pnl;
            if(pnl > 0) wins++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color:var(--text-dim)">${t.timestamp.toDate().toLocaleDateString()}</td>
                <td style="font-weight:700">${t.ticker}</td>
                <td><span class="badge" style="border:1px solid ${t.dir==='Long'?'var(--green)':'var(--red)'}">${t.dir}</span></td>
                <td>$${t.pIn}</td>
                <td>${t.pOut ? '$'+t.pOut : 'OPEN'}</td>
                <td style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pnl>=0?'+':''}${pnl.toFixed(2)}</td>
                <td><span class="badge ${pnl>=0?'badge-win':'badge-loss'}">${pnl>=0?'Win':'Loss'}</span></td>
                <td><button class="tag-btn" onclick="event.stopPropagation(); loadEdit('${t.id}')">Edit</button></td>
            `;
            tr.onclick = () => openDetail(t);
            list.appendChild(tr);
        });

        document.getElementById('st-pnl').innerText = `$${totalPnl.toFixed(2)}`;
        document.getElementById('side-pnl').innerText = `$${totalPnl.toFixed(2)}`;
        document.getElementById('st-count').innerText = currentTrades.length;
        document.getElementById('st-wr').innerText = currentTrades.length ? Math.round((wins/currentTrades.length)*100)+'%' : '0%';
    });

    // DETALLE Y TRADINGVIEW
    window.openDetail = (t) => {
        document.getElementById('trade-detail-view').style.display = 'grid';
        document.getElementById('det-ticker-title').innerText = `${t.ticker} — ${t.dir}`;
        const pnl = t.pOut ? (t.dir === 'Long' ? (t.pOut - t.pIn) : (t.pIn - t.pOut)) * t.qty - t.comm : 0;
        document.getElementById('det-pnl').innerText = `$${pnl.toFixed(2)}`;
        document.getElementById('det-pnl').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
        document.getElementById('det-prices').innerText = `$${t.pIn} → ${t.pOut || 'Abierto'}`;
        document.getElementById('det-notes').innerText = t.notes || "Sin notas.";
        
        new TradingView.widget({
            "autosize": true, "symbol": t.ticker, "interval": "5", "theme": "dark", "container_id": "tv-widget", "style": "1"
        });

        document.getElementById('btn-delete-action').onclick = async () => {
            if(confirm("¿Borrar trade?")) { await deleteDoc(doc(db, "trades", t.id)); closeDetail(); }
        };
        document.getElementById('btn-edit-action').onclick = () => { closeDetail(); loadEdit(t.id); };
    };

    window.loadEdit = (id) => {
        const t = currentTrades.find(x => x.id === id);
        nav('new-trade');
        document.getElementById('f-id').value = t.id;
        document.getElementById('f-ticker').value = t.ticker;
        document.getElementById('f-dir').value = t.dir;
        document.getElementById('f-qty').value = t.qty;
        document.getElementById('f-p-in').value = t.pIn;
        document.getElementById('f-p-out').value = t.pOut || "";
        document.getElementById('f-comm').value = t.comm;
        document.getElementById('f-notes').value = t.notes;
        document.getElementById('btn-save').innerText = "Actualizar Trade";
    };

    window.closeDetail = () => document.getElementById('trade-detail-view').style.display = 'none';
</script>
</body>
</html>
