<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Pro — Vercel Edition</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #0b0e14; --panel: #151921; --border: #242933;
            --text: #d1d4dc; --accent: #2962ff; --green: #089981; --red: #f23645;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .main { flex: 1; display: flex; flex-direction: column; }
        
        #chart { flex: 1; background: #000; margin: 15px; border-radius: 8px; border: 1px solid var(--border); }
        
        input, select { background: #1e222d; border: 1px solid var(--border); color: white; padding: 12px; margin-bottom: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:hover { filter: brightness(1.2); }
        
        .trade-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; background: #1c212b; margin-bottom: 8px; border-radius: 6px; }
        .trade-item:hover { border-color: var(--accent); }
        
        .status { font-size: 11px; margin-top: 5px; color: var(--green); opacity: 0.8; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--accent); margin:0 0 20px 0;">Journal Pro</h2>
    
    <div id="api-status" class="status">Cargando configuración de Vercel...</div>
    
    <div style="margin: 20px 0; border-top: 1px solid var(--border)"></div>

    <label style="font-size:12px; margin-bottom:5px; display:block;">NUEVA OPERACIÓN</label>
    <input type="text" id="t-sym" placeholder="Símbolo (AAPL, BTC/USD, EUR/USD)">
    <input type="date" id="t-date">
    <select id="t-side">
        <option value="buy">LONG (Compra)</option>
        <option value="sell">SHORT (Venta)</option>
    </select>
    <button class="btn" onclick="addTrade()">Añadir Trade</button>

    <div style="margin-top:20px; overflow-y:auto; flex:1">
        <label style="font-size:12px; margin-bottom:10px; display:block;">HISTORIAL DE TRADES</label>
        <div id="list"></div>
    </div>
</div>

<div class="main">
    <div id="chart"></div>
</div>

<script>
    let API_KEY = "";
    let trades = JSON.parse(localStorage.getItem('journal_v3_data') || '[]');
    let chart, candleSeries;

    // 1. Obtener la clave desde el Backend de Vercel (carpeta /api)
    async function fetchConfig() {
        try {
            const res = await fetch('/api/get-key.mjs');
            const data = await res.json();
            if (data.apiKey) {
                API_KEY = data.apiKey;
                document.getElementById('api-status').textContent = "✓ Conectado a Twelve Data (Vercel)";
            } else {
                throw new Error("No se encontró la clave en Vercel");
            }
        } catch (e) {
            document.getElementById('api-status').textContent = "✗ Error de configuración";
            document.getElementById('api-status').style.color = "var(--red)";
            console.error(e);
        }
    }

    // 2. Inicializar Gráfico
    function initChart() {
        const container = document.getElementById('chart');
        chart = LightweightCharts.createChart(container, {
            layout: { background: { color: '#000000' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#131722' }, horzLines: { color: '#131722' } },
            timeScale: { timeVisible: true }
        });
