<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingJournal.pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e11; --bg-sidebar: #12151c; --bg-card: #161a23; --bg-input: #1c212d;
            --border: #2a2f3d; --accent: #3b82f6; --text-main: #e5e7eb; --text-dim: #9ca3af;
            --green: #00d4a0; --red: #ff5566; --font-sans: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; }
        
        .app-container { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

        /* SIDEBAR - CORREGIDO */
        .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; z-index: 300; }
        .logo { padding: 0 24px 30px; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; color: #fff; }
        .logo span { color: var(--green); }
        .nav-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--text-dim); transition: 0.2s; font-size: 14px; }
        .nav-item.active { color: var(--accent); background: #3b82f610; border-left: 3px solid var(--accent); }

        /* MAIN CONTENT */
        .main-content { display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .top-bar { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); border-bottom: 1px solid var(--border); }
        .content-area { padding: 25px 30px; }
        .page { display: none; }
        .page.active { display: block; }

        /* CARDS ESTADÍSTICAS */
        .stats-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 15px; border-radius: 6px; }
        .stat-card label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-card .val { font-family: var(--font-mono); font-size: 16px; font-weight: 600; }

        /* FORMULARIO */
        .form-container { background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border); max-width: 1100px; margin: 0 auto; }
        .form-section-title { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
        .input, .select, .textarea { background: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 4px; outline: none; font-family: inherit; }
        
        .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-btn { padding: 6px 12px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; cursor: pointer; font-size: 11px; }
        .tag-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* TABLA */
        .table-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .trades-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .trades-table th { background: #1c212d; padding: 12px; text-align: left; color: var(--text-dim); font-size: 10px; text-transform: uppercase; }
        .trades-table td { padding: 14px 12px; border-bottom: 1px solid var(--border); }
        .badge { padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .badge-win { background: #00d4a020; color: var(--green); }
        .badge-loss { background: #ff556620; color: var(--red); }

        /* VISTA DETALLE */
        #trade-detail-view {
            position: fixed; top: 0; left: 240px; right: 0; bottom: 0;
            background: var(--bg-main); z-index: 500; display: none;
            grid-template-columns: 1fr 400px;
        }
        .detail-main { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .detail-header { padding: 20px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .detail-chart { flex: 1; background: #000; }
        .detail-sidebar { padding: 30px; overflow-y: auto; background: var(--bg-sidebar); }
        
        .info-block { margin-bottom: 25px; }
        .info-block label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 8px; }
        .info-block p { font-family: var(--font-mono); font-size: 16px; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">JOURNAL<span>.pro</span></div>
        <nav>
            <div class="nav-item active" onclick="nav('trades')">Mis trades</div>
            <div class="nav-item" onclick="resetForm(); nav('new-trade')">Nuevo trade</div>
            <div class="nav-item" onclick="nav('import')">Importar trade</div>
            <div class="nav-item" onclick="nav('analytics')">Analítica</div>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h2 id="page-title">Mis trades</h2>
            <button class="tag-btn" style="background:var(--accent); color:white; border:none; padding:8px 16px" onclick="resetForm(); nav('new-trade')">+ Registrar Trade</button>
        </div>

        <div class="content-area">
            <div id="p-trades" class="page active">
                <div class="stats-grid">
                    <div class="stat-card"><label>P&L Total</label><div class="val" id="st-pnl">$0.00</div></div>
                    <div class="stat-card"><label>Win Rate</label><div class="val" id="st-wr">0%</div></div>
                    <div class="stat-card"><label>Profit Factor</label><div class="val" id="st-pf">0.0</div></div>
                    <div class="stat-card"><label>Avg Win</label><div class="val" id="st-aw">$0.00</div></div>
                    <div class="stat-card"><label>Avg Loss</label><div class="val" id="st-al">$0.00</div></div>
                    <div class="stat-card"><label>Open</label><div class="val" id="st-open">0</div></div>
                    <div class="stat-card"><label>Total Trades</label><div class="val" id="st-count">0</div></div>
                </div>
                <div class="table-box">
                    <table class="trades-table">
                        <thead>
                            <tr><th>Fecha</th><th>Ticker</th><th>Dir</th><th>Setup</th><th>Entrada</th><th>Salida</th><th>P&L $</th><th>Estado</th><th></th></tr>
                        </thead>
                        <tbody id="trades-list"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-new-trade" class="page">
                <div class="form-container">
                    <form id="trade-form">
                        <input type="hidden" id="f-id">
                        <div class="form-section-title">Información del Activo</div>
                        <div class="input-row">
                            <div class="input-group"><label>Ticker *</label><input type="text" id="f-ticker" class="input" placeholder="GOOGL" required></div>
                            <div class="input-group"><label>Dirección *</label><select id="f-dir" class="select"><option>Long</option><option>Short</option></select></div>
                            <div class="input-group"><label>Cantidad *</label><input type="number" id="f-qty" class="input" value="100"></div>
                        </div>
                        <div class="input-row">
                            <div class="input-group"><label>Fecha Entrada</label><input type="date" id="f-date-in" class="input"></div>
                            <div class="input-group"><label>Hora Entrada</label><input type="time" id="f-time-in" class="input"></div>
                            <div class="input-group"><label>Precio Entrada *</label><input type="number" step="any" id="f-p-in" class="input" required></div>
                        </div>
                        <div class="input-row">
                            <div class="input-group"><label>Fecha Salida</label><input type="date" id="f-date-out" class="input"></div>
                            <div class="input-group"><label>Hora Salida</label><input type="time" id="f-time-out" class="input"></div>
                            <div class="input-group"><label>Precio Salida</label><input type="number" step="any" id="f-p-out" class="input"></div>
                        </div>
                        <div class="input-row">
                            <div class="input-group"><label>Stop Loss</label><input type="number" step="any" id="f-sl" class="input"></div>
                            <div class="input-group"><label>Comisión ($)</label><input type="number" step="any" id="f-comm" class="input" value="0"></div>
                            <div class="input-group"><label>Timeframe</label><select id="f-tf" class="select"><option>1m</option><option selected>5m</option><option>15m</option><option>1h</option><option>D</option></select></div>
                        </div>
                        <div style="margin-top:20px"><label>Notas / Razón de Entrada</label><textarea id="f-notes" class="textarea" rows="3"></textarea></div>
                        <button type="submit" class="tag-btn" style="background:var(--accent); color:white; padding:12px 40px; margin-top:20px" id="btn-save">GUARDAR TRADE</button>
                    </form>
                </div>
            </div>
            
            <div id="p-import" class="page"><h2>Importar Trades</h2></div>
            <div id="p-analytics" class="page"><h2>Analítica</h2></div>
        </div>

        <div id="trade-detail-view">
            <div class="detail-main">
                <div class="detail-header">
                    <div><h2 id="det-header-title">TICKER</h2></div>
                    <button class="tag-btn" onclick="closeDetail()">CERRAR VISTA</button>
                </div>
                <div class="detail-chart" id="tv-widget-full"></div>
            </div>
            <aside class="detail-sidebar">
                <div style="display:flex; gap:10px; margin-bottom:30px">
                    <button class="tag-btn" id="det-edit-btn" style="flex:1; background:var(--accent); color:white">EDITAR</button>
                    <button class="tag-btn" id="det-del-btn" style="flex:1; border-color:var(--red); color:var(--red)">ELIMINAR</button>
                </div>
                <div class="info-block"><label>P&L RESULTADO</label><p id="det-pnl" style="font-size:26px"></p></div>
                
                <div class="info-block">
                    <label>Notas de la Operación</label>
                    <textarea id="det-notes-input" class="textarea" rows="6" style="width:100%; background:var(--bg-main)"></textarea>
                </div>
                <div class="info-block">
                    <label>Lecciones</label>
                    <textarea id="det-lessons-input" class="textarea" rows="4" style="width:100%; background:var(--bg-main); color:var(--green)"></textarea>
                </div>
                <button id="btn-quick-save" class="tag-btn" style="width:100%; background:var(--green); color:#000; font-weight:700">GUARDAR CAMBIOS</button>
            </aside>
        </div>
    </main>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
        authDomain: "trading-journal-ac545.firebaseapp.com",
        projectId: "trading-journal-ac545",
        storageBucket: "trading-journal-ac545.firebasestorage.app",
        messagingSenderId: "113557647477",
        appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allTrades = [];

    window.nav = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('p-' + id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    };

    window.resetForm = () => {
        document.getElementById('trade-form').reset();
        document.getElementById('f-id').value = "";
    };

    document.getElementById('trade-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('f-id').value;
        const data = {
            ticker: document.getElementById('f-ticker').value.toUpperCase(),
            dir: document.getElementById('f-dir').value,
            qty: parseFloat(document.getElementById('f-qty').value),
            dateIn: document.getElementById('f-date-in').value,
            timeIn: document.getElementById('f-time-in').value,
            pIn: parseFloat(document.getElementById('f-p-in').value),
            pOut: parseFloat(document.getElementById('f-p-out').value) || null,
            comm: parseFloat(document.getElementById('f-comm').value) || 0,
            timestamp: new Date()
        };
        id ? await updateDoc(doc(db, "trades", id), data) : await addDoc(collection(db, "trades"), data);
        nav('trades');
    });

    onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snap) => {
        const list = document.getElementById('trades-list');
        list.innerHTML = "";
        let totalPnl = 0;
        allTrades = [];

        snap.forEach(d => {
            const t = { id: d.id, ...d.data() };
            allTrades.push(t);
            const pnl = t.pOut ? (t.dir === 'Long' ? (t.pOut - t.pIn) : (t.pIn - t.pOut)) * t.qty - t.comm : 0;
            totalPnl += pnl;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${t.dateIn || '-'}</td>
                <td style="font-weight:700">${t.ticker}</td>
                <td><span class="badge" style="border:1px solid ${t.dir==='Long'?'var(--green)':'var(--red)'}">${t.dir}</span></td>
                <td>-</td>
                <td>$${t.pIn}</td>
                <td>${t.pOut ? '$'+t.pOut : 'OPEN'}</td>
                <td style="color:${pnl>=0?'var(--green)':'var(--red)'}">$${pnl.toFixed(2)}</td>
                <td><span class="badge ${pnl>=0?'badge-win':'badge-loss'}">${t.pOut ? 'Closed' : 'Open'}</span></td>
                <td><button class="tag-btn" onclick="event.stopPropagation(); loadEdit('${t.id}')">Edit</button></td>
            `;
            tr.onclick = () => openDetail(t);
            list.appendChild(tr);
        });
        document.getElementById('st-pnl').innerText = `$${totalPnl.toFixed(2)}`;
    });

    window.openDetail = (t) => {
        document.getElementById('trade-detail-view').style.display = 'grid';
        document.getElementById('det-header-title').innerText = `${t.ticker} — ${t.dir}`;
        const pnl = t.pOut ? (t.dir === 'Long' ? (t.pOut - t.pIn) : (t.pIn - t.pOut)) * t.qty - t.comm : 0;
        document.getElementById('det-pnl').innerText = `$${pnl.toFixed(2)}`;
        document.getElementById('det-pnl').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
        
        // Cargar textos en áreas editables
        document.getElementById('det-notes-input').value = t.notes || "";
        document.getElementById('det-lessons-input').value = t.lessons || "";

        // GRÁFICO CORREGIDO - 2 MINUTOS
        document.getElementById('tv-widget-full').innerHTML = ""; // Limpiar antes de cargar
        new TradingView.widget({
            "autosize": true,
            "symbol": t.ticker,
            "interval": "2", // Forzado a 2min
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "container_id": "tv-widget-full"
        });

        // GUARDADO RÁPIDO
        document.getElementById('btn-quick-save').onclick = async () => {
            await updateDoc(doc(db, "trades", t.id), {
                notes: document.getElementById('det-notes-input').value,
                lessons: document.getElementById('det-lessons-input').value
            });
            alert("Guardado correctamente");
        };

        document.getElementById('det-del-btn').onclick = async () => {
            if(confirm("¿Eliminar?")) { await deleteDoc(doc(db, "trades", t.id)); closeDetail(); }
        };
        document.getElementById('det-edit-btn').onclick = () => { closeDetail(); loadEdit(t.id); };
    };

    window.loadEdit = (id) => {
        const t = allTrades.find(x => x.id === id);
        nav('new-trade');
        document.getElementById('f-id').value = t.id;
        document.getElementById('f-ticker').value = t.ticker;
        document.getElementById('f-p-in').value = t.pIn;
        document.getElementById('f-p-out').value = t.pOut || "";
    };

    window.closeDetail = () => document.getElementById('trade-detail-view').style.display = 'none';
</script>
</body>
</html>
