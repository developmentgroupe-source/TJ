<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trading Journal Pro</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #0b0e14; --panel: #151921; --border: #242933; --text: #d1d4dc; --accent: #2962ff; --green: #089981; --red: #f23645; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        .main { flex: 1; display: flex; flex-direction: column; }
        #chart { flex: 1; margin: 20px; background: #000; border-radius: 8px; border: 1px solid var(--border); }
        input, select { background: #1e222d; border: 1px solid var(--border); color: white; padding: 10px; margin-bottom: 10px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .trade-item { padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; }
        .trade-item:hover { background: #1e222d; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Configuración</h3>
    <input type="password" id="api-key" placeholder="Pega tu Twelve Data API Key">
    <button class="btn" onclick="saveKey()">Guardar API Key</button>
    <hr style="width:100%; border:0; border-top:1px solid var(--border); margin: 20px 0;">
    
    <h3>Nuevo Trade</h3>
    <input type="text" id="t-sym" placeholder="Símbolo (AAPL, BTC/USD)">
    <input type="date" id="t-date">
    <select id="t-side"><option value="buy">BUY (Largo)</option><option value="sell">SELL (Corto)</option></select>
    <button class="btn" style="background:var(--green)" onclick="addTrade()">+ Añadir y Ver</button>

    <div id="list" style="margin-top:20px; overflow-y:auto"></div>
</div>

<div class="main">
    <div id="chart"></div>
</div>

<script>
    let trades = JSON.parse(localStorage.getItem('my_trades') || '[]');
    let chart, candleSeries;

    // Iniciar Gráfico
    function init() {
        const container = document.getElementById('chart');
        chart = LightweightCharts.createChart(container, {
            layout: { background: { color: '#000000' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
            timeScale: { timeVisible: true }
        });
        candleSeries = chart.addCandlestickSeries();
        
        const savedKey = localStorage.getItem('td_key');
        if(savedKey) document.getElementById('api-key').value = savedKey;
        renderList();
        
        // Fecha por defecto hoy
        document.getElementById('t-date').value = new Date().toISOString().split('T')[0];
    }

    function saveKey() {
        localStorage.setItem('td_key', document.getElementById('api-key').value);
        alert("API Key Guardada ✓");
    }

    async function addTrade() {
        const sym = document.getElementById('t-sym').value.toUpperCase();
        const date = document.getElementById('t-date').value;
        const side = document.getElementById('t-side').value;
        const key = localStorage.getItem('td_key');

        if(!sym || !key) return alert("Falta símbolo o API Key");

        const newTrade = { sym, date, side, id: Date.now() };
        trades.unshift(newTrade);
        localStorage.setItem('my_trades', JSON.stringify(trades));
        renderList();
        loadChart(newTrade);
    }

    async function loadChart(trade) {
        const key = localStorage.getItem('td_key');
        // Pedimos datos de 1 hora para ver el trade con detalle
        const url = `https://api.twelvedata.com/time_series?symbol=${trade.sym}&interval=1h&apikey=${key}&outputsize=100`;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            if(data.status === "error") throw new Error(data.message);

            const bars = data.values.map(v => ({
                time: new Date(v.datetime).getTime() / 1000,
                open: parseFloat(v.open), high: parseFloat(v.high),
                low: parseFloat(v.low), close: parseFloat(v.close)
            })).sort((a,b) => a.time - b.time);

            candleSeries.setData(bars);
            
            // Poner flecha en la fecha del trade
            const tradeTs = new Date(trade.date).getTime() / 1000;
            candleSeries.setMarkers([{
                time: tradeTs,
                position: trade.side === 'buy' ? 'belowBar' : 'aboveBar',
                color: trade.side === 'buy' ? '#089981' : '#f23645',
                shape: trade.side === 'buy' ? 'arrowUp' : 'arrowDown',
                text: trade.side.toUpperCase()
            }]);

            chart.timeScale().fitContent();
        } catch(e) {
            alert("Error: " + e.message);
        }
    }

    function renderList() {
        const container = document.getElementById('list');
        container.innerHTML = '<b>Trades Guardados:</b>';
        trades.forEach(t => {
            const d = document.createElement('div');
            d.className = 'trade-item';
            d.innerHTML = `<b>${t.sym}</b> - ${t.date} (${t.side})`;
            d.onclick = () => loadChart(t);
            container.appendChild(d);
        });
    }

    init();
</script>
</body>
</html>
