<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Trading Journal — Pro Database</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e28;--bg4:#222736;
  --border:#2a2f3d;--border2:#363c50;
  --text:#e8eaf0;--text2:#8b90a0;--text3:#555a6a;
  --green:#00d4a0;--green-bg:#00d4a015;
  --red:#ff5566;--red-bg:#ff556610;
  --blue:#4a9eff;--blue-bg:#4a9eff12;
  --font-mono:'IBM Plex Mono',monospace;
  --font-sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}

/* SIDEBAR */
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:24px;font-weight:500;font-size:16px;letter-spacing:1px;border-bottom:1px solid var(--border)}
.logo span{color:var(--green);font-family:var(--font-mono)}
.nav-item{padding:12px 24px;cursor:pointer;color:var(--text2);font-size:14px;transition:0.2s}
.nav-item.active{color:var(--blue);background:var(--blue-bg);border-right:3px solid var(--blue)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.view{flex:1;overflow-y:auto;padding:30px;display:none}
.view.active{display:block}

/* METRICS (7 Cards - Imagen 1) */
.metrics-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:30px}
.m-card{background:var(--bg2);border:1px solid var(--border);padding:15px;border-radius:4px}
.m-card label{display:block;font-size:9px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono)}
.m-card .val{font-size:15px;font-family:var(--font-mono);font-weight:500}

/* FORM (Imagen 2 & 4) */
.f-box{max-width:900px;margin:0 auto;background:var(--bg2);border:1px solid var(--border);padding:35px;border-radius:4px}
.f-title{font-size:11px;color:var(--blue);text-transform:uppercase;margin:25px 0 15px;display:flex;align-items:center;gap:10px}
.f-title::after{content:'';flex:1;height:1px;background:var(--border)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:15px}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:4px;outline:none}
.tag-b{padding:6px 12px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;font-size:11px}
.tag-b.sel{background:var(--blue);color:#fff}

/* DETAIL (Imagen 5) */
#detail-view{position:fixed;top:0;left:260px;right:0;bottom:0;background:var(--bg);z-index:500;display:none;grid-template-columns:1fr 380px}
.det-main{border-right:1px solid var(--border);display:flex;flex-direction:column}
.det-side{background:var(--bg2);padding:30px;overflow-y:auto}
#tv-widget{flex:1;background:#000}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">JOURNAL<span>.PRO</span></div>
  <div class="nav-item active" onclick="nav('list')">Mis Trades</div>
  <div class="nav-item" onclick="nav('form')">+ Nuevo Trade</div>
  <div class="sidebar-foot" style="margin-top:auto;padding:20px;border-top:1px solid var(--border)">
    <label style="font-size:10px;color:var(--text3)">P&L TOTAL</label>
    <div id="side-pnl" style="font-family:var(--font-mono);font-size:20px">$0.00</div>
  </div>
</aside>

<main class="main">
  <header class="header">
    <h2 id="view-title">Mis Trades</h2>
  </header>

  <div id="v-list" class="view active">
    <div class="metrics-row">
        <div class="m-card"><label>P&L Total</label><div class="val" id="m-pnl">$0</div></div>
        <div class="m-card"><label>Win Rate</label><div class="val" id="m-wr">0%</div></div>
        <div class="m-card"><label>Profit Factor</label><div class="val" id="m-pf">0.0</div></div>
        <div class="m-card"><label>Avg Win</label><div class="val" id="m-aw">$0</div></div>
        <div class="m-card"><label>Avg Loss</label><div class="val" id="m-al">$0</div></div>
        <div class="m-card"><label>Open</label><div class="val" id="m-open">0</div></div>
        <div class="m-card"><label>Total</label><div class="val" id="m-total">0</div></div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border)">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:var(--bg3);text-align:left;font-size:10px;color:var(--text3)">
            <th style="padding:12px">FECHA</th><th>TICKER</th><th>L/S</th><th>SETUP</th><th>ENTRADA</th><th>SALIDA</th><th>P&L</th><th>STATUS</th>
          </tr>
        </thead>
        <tbody id="trades-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="v-form" class="view">
    <div class="f-box">
      <form id="trade-form">
        <div class="f-title">Asset Information</div>
        <div class="grid-3">
          <div><label style="font-size:10px;color:var(--text3)">TICKER</label><input type="text" id="f-sym" required></div>
          <div><label style="font-size:10px;color:var(--text3)">DIRECTION</label><select id="f-side"><option>Long</option><option>Short</option></select></div>
          <div><label style="font-size:10px;color:var(--text3)">QUANTITY</label><input type="number" id="f-qty"></div>
        </div>

        <div class="f-title">Execution Details</div>
        <div class="grid-3">
          <div><label style="font-size:10px;color:var(--text3)">DATE</label><input type="date" id="f-date"></div>
          <div><label style="font-size:10px;color:var(--text3)">ENTRY PRICE</label><input type="number" step="any" id="f-pIn"></div>
          <div><label style="font-size:10px;color:var(--text3)">EXIT PRICE</label><input type="number" step="any" id="f-pOut"></div>
        </div>

        <div class="f-title">Risk Management & Metrics</div>
        <div class="grid-3">
          <div><label style="font-size:10px;color:var(--text3)">STOP LOSS</label><input type="number" step="any" id="f-sl"></div>
          <div><label style="font-size:10px;color:var(--text3)">TIMEFRAME</label><select id="f-tf"><option>1m</option><option>5m</option><option>15m</option><option>1h</option><option>D</option></select></div>
          <div><label style="font-size:10px;color:var(--text3)">EXCHANGE</label><input type="text" id="f-ex" placeholder="NASDAQ"></div>
        </div>
        <div class="grid-3">
          <div><label style="font-size:10px;color:var(--text3)">COMMISSION</label><input type="number" step="any" id="f-comm" value="0"></div>
        </div>

        <div class="f-title">Classification</div>
        <div style="margin-bottom:20px" class="tag-c" id="tag-container"></div>
        <textarea id="f-notes" placeholder="Notas de entrada..." rows="3" style="margin-bottom:15px"></textarea>
        <textarea id="f-lessons" placeholder="Lecciones aprendidas..." rows="2"></textarea>
        
        <button type="submit" style="width:100%;padding:15px;background:var(--blue);border:none;color:#fff;margin-top:20px;cursor:pointer">GUARDAR REGISTRO</button>
      </form>
    </div>
  </div>

  <div id="detail-view">
    <div class="det-main">
      <div class="header"><h2 id="d-title"></h2><button onclick="closeDetail()">Cerrar</button></div>
      <div id="tv-widget"></div>
    </div>
    <aside class="det-side">
      <div style="margin-bottom:20px"><label>P&L NETO</label><div id="d-pnl" style="font-size:28px;font-family:var(--font-mono)"></div></div>
      <div id="d-info" style="font-size:13px;color:var(--text2);line-height:2"></div>
      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:20px">
        <label>NOTAS</label><p id="d-notes" style="font-size:14px;margin-top:10px"></p>
        <label style="margin-top:20px;display:block">LECCIONES</label><p id="d-lessons" style="font-size:14px;color:var(--green);margin-top:10px"></p>
      </div>
    </aside>
  </div>
</main>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBSyRUK_KMRyECGZ5NRZ1wvE5WcYFm05Sw",
    authDomain: "trading-journal-ac545.firebaseapp.com",
    projectId: "trading-journal-ac545",
    storageBucket: "trading-journal-ac545.firebasestorage.app",
    appId: "1:113557647477:web:79ba58c3f5ff6efd00c83c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let trades = [];

window.nav = (v) => {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
};

const tagList = ["Gap & Go", "Breakout", "Pullback", "VWAP", "Reversal"];
const tCont = document.getElementById('tag-container');
tagList.forEach(t => {
  const b = document.createElement('span'); b.className='tag-b'; b.textContent=t;
  b.onclick=()=>b.classList.toggle('sel');
  tCont.appendChild(b);
});

onSnapshot(query(collection(db, "trades"), orderBy("timestamp", "desc")), (snap) => {
  trades = snap.docs.map(d => ({id:d.id, ...d.data()}));
  render();
});

function render() {
  const tbody = document.getElementById('trades-tbody'); tbody.innerHTML='';
  let totalPnl = 0, wins = 0, closed = 0, gWin = 0, gLoss = 0;
  
  trades.forEach(t => {
    const pnl = t.pOut ? (t.side === 'Long' ? (t.pOut - t.pIn) : (t.pIn - t.pOut)) * t.qty - (t.comm||0) : 0;
    if(t.pOut) { totalPnl += pnl; closed++; if(pnl>0){wins++; gWin+=pnl;} else {gLoss+=Math.abs(pnl);} }
    
    const tr = document.createElement('tr');
    tr.style.borderBottom='1px solid var(--border)'; tr.style.cursor='pointer';
    tr.innerHTML = `<td style="padding:12px">${t.edate}</td><td>${t.sym}</td><td style="color:${t.side==='Long'?'var(--green)':'var(--red)'}">${t.side}</td><td>${t.setup||'-'}</td><td>$${t.pIn}</td><td>${t.pOut?'$'+t.pOut:'OPEN'}</td><td style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pnl.toFixed(2)}</td><td><span style="background:${pnl>=0?'var(--green-bg)':'var(--red-bg)'};padding:2px 6px">${t.pOut?(pnl>=0?'WIN':'LOSS'):'OPEN'}</span></td>`;
    tr.onclick = () => openDetail(t, pnl);
    tbody.appendChild(tr);
  });

  document.getElementById('m-pnl').textContent = `$${totalPnl.toFixed(2)}`;
  document.getElementById('m-wr').textContent = closed ? Math.round((wins/closed)*100)+'%' : '0%';
  document.getElementById('m-pf').textContent = gLoss ? (gWin/gLoss).toFixed(2) : '0.0';
  document.getElementById('m-total').textContent = trades.length;
  document.getElementById('side-pnl').textContent = `$${totalPnl.toFixed(2)}`;
}

document.getElementById('trade-form').onsubmit = async (e) => {
  e.preventDefault();
  const setups = Array.from(document.querySelectorAll('.tag-b.sel')).map(x=>x.textContent);
  await addDoc(collection(db, "trades"), {
    sym: document.getElementById('f-sym').value.toUpperCase(),
    side: document.getElementById('f-side').value,
    qty: parseFloat(document.getElementById('f-qty').value),
    edate: document.getElementById('f-date').value,
    pIn: parseFloat(document.getElementById('f-pIn').value),
    pOut: parseFloat(document.getElementById('f-pOut').value) || null,
    sl: parseFloat(document.getElementById('f-sl').value),
    tf: document.getElementById('f-tf').value,
    ex: document.getElementById('f-ex').value,
    comm: parseFloat(document.getElementById('f-comm').value),
    setup: setups.join(', '),
    notes: document.getElementById('f-notes').value,
    lessons: document.getElementById('f-lessons').value,
    timestamp: new Date()
  });
  nav('list');
};

window.openDetail = (t, pnl) => {
  document.getElementById('detail-view').style.display = 'grid';
  document.getElementById('d-title').textContent = t.sym + ' — ' + t.side;
  document.getElementById('d-pnl').textContent = '$' + pnl.toFixed(2);
  document.getElementById('d-info').innerHTML = `ENTRY: $${t.pIn}<br>EXIT: ${t.pOut?'$'+t.pOut:'OPEN'}<br>EXCHANGE: ${t.ex}<br>TIMEFRAME: ${t.tf}`;
  document.getElementById('d-notes').textContent = t.notes;
  document.getElementById('d-lessons').textContent = t.lessons;
  new TradingView.widget({"autosize":true, "symbol":t.sym, "interval":t.tf, "theme":"dark", "container_id":"tv-widget"});
};

window.closeDetail = () => document.getElementById('detail-view').style.display = 'none';
</script>
</body>
</html>
